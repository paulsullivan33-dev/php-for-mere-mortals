site_name: PHP for Mere Mortals
site_description: The language inside a large share of the web. Types, arrays and text work, a database spoken to safely, a small web application built and then attacked to prove its defences, packages installed with their signatures checked, and the production wiring described honestly rather than faked, with the limits stated plainly.
